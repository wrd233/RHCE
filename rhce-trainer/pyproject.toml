[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rhce-trainer"
version = "0.1.0"
description = "Local RHCE 9 practice CLI with isolated replay grading"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
rhce = "rhce_trainer.cli:main"

[tool.setuptools.package-data]
rhce_trainer = ["questions.json", "remote/*.py"]
